<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231b4278'/%3E%3Cstop offset='1' stop-color='%230b1f3a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23a)'/%3E%3Cpath d='M12 31 32 14 52 31' fill='none' stroke='%23fff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='18.5' y='42' width='7.5' height='8' rx='2' fill='%23fff'/%3E%3Crect x='28.2' y='37' width='7.5' height='13' rx='2' fill='%23fff'/%3E%3Crect x='37.9' y='31.5' width='7.5' height='18.5' rx='2' fill='%2312b76a'/%3E%3C/svg%3E">
<title>Monitoring Keuangan Maintenance Cabang</title>
<style>
:root{--navy:#0b1f3a;--navy2:#12305a;--navy3:#1b4278;--green:#12b76a;--green-d:#0e9f5c;--green-l:#e7f8ef;--red:#e5484d;--red-d:#c0262d;--red-l:#fdecec;--amber:#f59e0b;--amber-l:#fff4dc;--bg:#f2f5fa;--card:#fff;--line:#e3e8f0;--txt:#0f1d33;--mut:#62708a;--shadow:0 1px 2px rgba(11,31,58,.05),0 8px 24px rgba(11,31,58,.06);--sb:260px;--out:#1b4278;--track:#eef2f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;touch-action:manipulation;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.pos{color:var(--green-d)}.neg{color:var(--red-d)}
.app{min-height:100vh}
/* sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb);background:linear-gradient(180deg,var(--navy) 0%,#0a2447 100%);color:#cfd9ea;display:flex;flex-direction:column;z-index:60;transition:transform .28s ease;padding-top:env(safe-area-inset-top)}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px 18px}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 6px 14px rgba(18,183,106,.35))}
.logo svg{width:44px;height:44px;display:block}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.2px}.brand small{font-size:11px;color:#8fa3c4}
#sideNav{padding:8px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;border:0;background:transparent;color:#b9c7de;cursor:pointer;text-align:left;font-weight:600;font-size:14px;transition:.18s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.active{background:var(--green);color:#fff;box-shadow:0 6px 14px rgba(18,183,106,.35)}
.side-foot{padding:14px 20px 20px;font-size:11.5px;color:#7f93b5;border-top:1px solid rgba(255,255,255,.08)}
.scrim{position:fixed;inset:0;background:rgba(8,20,40,.5);opacity:0;pointer-events:none;transition:.25s;z-index:55}
/* main */
.main{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top))}
.topbar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .date{color:var(--mut);font-size:12.5px;white-space:nowrap}
.topbar .menu-btn{display:none}
.tbl td.r,.tbl td:first-child{white-space:nowrap}
.view{padding:24px;max-width:1300px;width:100%;margin:0 auto}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bottomnav{display:none}
/* components */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.card h3{margin:0 0 14px;font-size:15px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn.navy{background:var(--navy2)}.btn.navy:hover{background:var(--navy3)}
.btn.ghost{background:#fff;color:var(--navy2);border:1px solid var(--line)}.btn.ghost:hover{background:#f4f7fb}
.btn.danger{background:var(--red)}.btn.danger:hover{background:var(--red-d)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:12.5px;border-radius:9px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy2);cursor:pointer;transition:.15s}
.icon-btn:hover{background:#eef3fa}.icon-btn.del{color:var(--red-d)}.icon-btn.del:hover{background:var(--red-l)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g-form{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.stat{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.stat .lbl{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:600;font-size:12.5px}
.stat .lbl .ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.stat .val{font-size:22px;font-weight:800;letter-spacing:-.3px;word-break:break-word}
.stat .hint{font-size:12px;color:var(--mut)}
.stat.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff}
.stat.hero .lbl,.stat.hero .hint{color:#b8c8e4}.stat.hero .ib{background:rgba(255,255,255,.14);color:#fff}
.stat.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(18,183,106,.25)}
.ib.g{background:var(--green-l);color:var(--green-d)}.ib.r{background:var(--red-l);color:var(--red-d)}.ib.n{background:#e8eefa;color:var(--navy3)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:#3a4a66}
.field input,.field select,.field textarea,.sel{width:100%;border:1px solid #d5dce8;background:#fff;border-radius:11px;padding:10px 12px;outline:0;transition:.15s;min-height:42px;font-size:15px}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field select:focus,.field textarea:focus,.sel:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,183,106,.18)}
.row{display:flex;gap:8px;align-items:stretch}.row>select{flex:1;min-width:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .full{grid-column:1/-1}
.money{position:relative}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-weight:700}.money input{padding-left:40px;font-weight:700}
.photo-box .drop{border:2px dashed #cdd6e5;border-radius:12px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;background:#fafbfe;transition:.15s;width:100%}
.photo-box .drop:hover{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.photo-box .pv{display:flex;gap:12px;align-items:center}
.photo-box img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.formbtns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.green{background:var(--green-l);color:var(--green-d)}.badge.red{background:var(--red-l);color:var(--red-d)}.badge.amber{background:var(--amber-l);color:#a96300}.badge.gray{background:#eceff5;color:#5a667c}
.tablewrap{overflow-x:auto;border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#f4f7fb;text-align:left;padding:10px 12px;font-size:12px;color:#4a5a78;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:#f8fafd}
.tbl .r{text-align:right}.tbl tfoot td{font-weight:800;background:#f4f7fb;border-top:2px solid var(--line)}
.tbl .acts{white-space:nowrap;display:flex;gap:6px}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.txli{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.txli:first-child{border-top:0}
.txli .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico.in{background:var(--green-l);color:var(--green-d)}.ico.out{background:#e8eefa;color:var(--navy3)}
.txli .mid{flex:1;min-width:0}.txli .mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txli .sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txli .amt{font-weight:800;white-space:nowrap;text-align:right}
.txli .acts{display:flex;gap:6px}
.empty{padding:28px 12px;text-align:center;color:var(--mut)}.empty svg{width:34px;height:34px;opacity:.5}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:linear-gradient(90deg,var(--green-l),#f2fbf6);border:1px solid #c8efd9;margin-bottom:16px}
.notice.warn{background:var(--amber-l);border-color:#f7dca0}
.chartwrap{position:relative;width:100%}
.chartwrap canvas{display:block;width:100%}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut .dl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.donut .dl div{display:flex;align-items:center;gap:8px}.donut .dl i{width:10px;height:10px;border-radius:3px;flex:none}.donut .dl span{margin-left:auto;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.bcard{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.bcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(11,31,58,.12)}
.bhead{display:flex;gap:12px;align-items:center}.bhead>div:nth-child(2){flex:1;min-width:0}.bhead b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bav{width:42px;height:42px;border-radius:12px;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.bsaldo{display:flex;justify-content:space-between;align-items:baseline}.bsaldo b{font-size:20px}
.bmini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bmini div{background:#f5f8fc;border-radius:10px;padding:8px 10px}.bmini span{display:block;font-size:11.5px;color:var(--mut)}.bmini b{font-size:13.5px}
.bar{height:7px;border-radius:99px;background:#e8edf5;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.bar.red i{background:var(--red)}.bar.amber i{background:var(--amber)}
.bact{display:flex;gap:8px;margin-top:2px}.bact .btn{flex:1}
.overlay{position:fixed;inset:0;background:rgba(8,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .18s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{max-width:780px}.modal h3{margin:0 0 14px;font-size:17px}
.modal .mb{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal img.big{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.toast{background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);font-weight:600;animation:fade .2s;max-width:90vw}
.toast.err{background:var(--red-d)}.toast.ok{background:var(--green-d)}
.sumchips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#f5f8fc;border-radius:11px;padding:8px 13px;font-size:12.5px}.chip b{display:block;font-size:15px}
.rep-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:3px solid var(--green);padding-bottom:12px;margin-bottom:16px}
.rep-head h2{margin:0;font-size:20px}.rep-head .org{font-size:12px;font-weight:700;color:var(--green-d);text-transform:uppercase;letter-spacing:.6px}
.sec{margin:20px 0 8px;font-size:14px;font-weight:800;color:var(--navy2)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g-main,.g-form{grid-template-columns:1fr}}
@media(max-width:1023px){
 .sidebar{transform:translateX(-100%)}
 body.menu-open .sidebar{transform:none}
 body.menu-open .scrim{opacity:1;pointer-events:auto}
 .main{margin-left:0}
 .topbar .menu-btn{display:inline-grid}
 .topbar .qa{display:none!important}
 .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
 .topbar .date{display:none}
 .view{padding:14px;padding-bottom:96px}
 .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(11,31,58,.07)}
 .bn{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:10px;cursor:pointer}
 .bn.active{color:var(--green-d)}.bn.active svg{stroke:var(--green-d)}
 #toasts{bottom:84px}
}
@media(max-width:700px){
 .g3,.g2{grid-template-columns:1fr}
 .fg{grid-template-columns:1fr}
 .g4{gap:10px}.stat .val{font-size:17px}.card{padding:15px}
 .g4 .stat.hero{grid-column:1/-1}
 .tbl.stack thead{display:none}
 .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:100%}
 .tbl.stack tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px;background:#fff}
 .tbl.stack td{display:flex;justify-content:space-between;gap:14px;border:0;padding:4px 0;text-align:right}
 .tbl.stack td::before{content:attr(data-l);color:var(--mut);font-weight:700;text-align:left;flex:none}
 .tbl.stack td.acts{justify-content:flex-end}.tbl.stack td.acts::before{display:none}
 .topbar .qa span{display:none}
 .bgrid{grid-template-columns:1fr}
 .modal{padding:18px}
}
.no-pb{padding-bottom:0}
/* ===== UI POLISH ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.fade .card,.view.fade .bcard,.view.fade .notice,.view.fade .hello,.view.fade .filters{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.view.fade .grid>*:nth-child(2){animation-delay:.06s}.view.fade .grid>*:nth-child(3){animation-delay:.12s}.view.fade .grid>*:nth-child(4){animation-delay:.18s}
.view.fade .bgrid>*:nth-child(n+2){animation-delay:.07s}.view.fade .bgrid>*:nth-child(n+4){animation-delay:.14s}
.card.stat{transition:transform .2s ease,box-shadow .2s ease}
.card.stat:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(11,31,58,.16)}
.stat .lbl .ib{transition:transform .25s ease}.stat:hover .ib{transform:scale(1.12) rotate(-6deg)}
.btn:active{transform:scale(.97)}
.nav{position:relative}.nav:hover{transform:translateX(3px)}.nav.active:hover{transform:none}
.sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px 220px at 0% 0%,rgba(18,183,106,.2),transparent 70%),radial-gradient(300px 260px at 100% 100%,rgba(37,99,235,.22),transparent 70%)}
.sidebar>*{position:relative}
.sf-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sf-card span{display:block;font-size:11px;color:#8fa3c4}.sf-card b{color:#fff;font-size:15px}
.sf-info{line-height:1.5}
.stat.hero>*{position:relative;z-index:1}
.blgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));column-gap:28px}
.blgrid>div{border-top:0!important;padding:8px 0!important}
.spark{display:block;width:100%;height:38px;margin-top:8px}
.hello{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{margin:0;font-size:22px;letter-spacing:-.3px}.hello p{margin:3px 0 0;color:var(--mut)}
.hello-act{display:flex;gap:8px}
@media(min-width:1024px){.hello-act{display:none}}
/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% 38%,#16407a 0%,#0b1f3a 55%,#06142a 100%);color:#fff;overflow:hidden;transition:opacity .7s ease,transform .7s ease,visibility .7s}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
#splash .bgfx{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 70%);mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 70%);animation:gridMove 12s linear infinite}
@keyframes gridMove{to{background-position:44px 44px}}
.orb{position:absolute;border-radius:50%;filter:blur(60px);animation:orbf 9s ease-in-out infinite}
.orb.o1{width:340px;height:340px;background:#12b76a;left:-80px;bottom:-100px;opacity:.28}
.orb.o2{width:300px;height:300px;background:#2563eb;right:-80px;top:-60px;opacity:.3;animation-delay:-4s}
@keyframes orbf{50%{transform:translate(30px,-26px) scale(1.08)}}
.parts{position:absolute;inset:0;pointer-events:none}
.pt{position:absolute;bottom:-20px;border-radius:50%;background:#fff;animation:ptrise linear infinite}
@keyframes ptrise{to{transform:translateY(-115vh)}}
.sp-logo{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:26px}
.sp-logo .ring{position:absolute;inset:-6px;border-radius:38px;border:2px solid rgba(46,229,157,.55);animation:ring 2.6s ease-out infinite}
.sp-logo .ring.r2{animation-delay:1.3s}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.sp-logo svg{width:132px;height:132px;filter:drop-shadow(0 18px 36px rgba(18,183,106,.4));animation:logoIn .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes logoIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.lg-roof{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lg-bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .6s cubic-bezier(.2,.9,.3,1.3) forwards}

<script>
/* ===================== LIB (fungsi murni) ===================== */
const pad=n=>String(n).padStart(2,'0');
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MON_S=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DAYS_S=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtNum=n=>{n=Math.round(+n||0);const neg=n<0;return (neg?'-':'')+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
const rp=n=>{n=Math.round(+n||0);return (n<0?'-':'')+'Rp '+fmtNum(Math.abs(n));};
const shortRp=v=>{const a=Math.abs(v);const f=x=>(Math.round(x*10)/10).toString().replace('.',',');if(a>=1e12)return f(v/1e12)+' T';if(a>=1e9)return f(v/1e9)+' M';if(a>=1e6)return f(v/1e6)+' jt';if(a>=1e3)return f(v/1e3)+' rb';return String(Math.round(v));};
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmtDate=s=>{if(!s)return '-';const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;};
const fmtDT=d=>fmtDate(isoOf(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes());
function niceMax(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=[1,2,4,6,8,10].find(x=>n<=x+1e-9);return m*p;}

/* ---- ZIP (store) + XLSX ---- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),sz=data.length;
    const lh=Uint8Array.from([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,data);
    cd.push(Uint8Array.from([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz;
  });
  let cdSize=0;cd.forEach(c=>cdSize+=c.length);
  const end=Uint8Array.from([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...cd,end];let total=0;all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;
}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
const xe=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* sheet: {name, widths:[], rows:[[cell...]]}; cell = value | {v, s}; s: 1 bold,2 header,3 number,4 bold number,5 title */
function sheetXml(sh){
  let rows='';
  sh.rows.forEach((row,ri)=>{let cs='';
    row.forEach((c,ci)=>{if(c===null||c===undefined||c==='')return;const cell=(typeof c==='object')?c:{v:c};const ref=colName(ci)+(ri+1);const s=cell.s?` s="${cell.s}"`:'';
      if(typeof cell.v==='number')cs+=`<c r="${ref}"${s}><v>${cell.v}</v></c>`;
      else cs+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(cell.v)}</t></is></c>`;});
    rows+=`<row r="${ri+1}">${cs}</row>`;});
  const cols=sh.widths?'<cols>'+sh.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>':'';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${rows}</sheetData></worksheet>`;
}
function buildXlsxBytes(sheets){
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const head='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const files=[];
  files.push({name:'[Content_Types].xml',text:head+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'});
  files.push({name:'_rels/.rels',text:head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'});
  files.push({name:'xl/workbook.xml',text:head+`<workbook xmlns="${NS}" xmlns:r="${R}"><sheets>`+sheets.map((s,i)=>`<sheet name="${xe(s.name.replace(/[\[\]:*?\/\\]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'});
  files.push({name:'xl/_rels/workbook.xml.rels',text:head+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
  files.push({name:'xl/styles.xml',text:head+`<styleSheet xmlns="${NS}"><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B1F3A"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,text:sheetXml(s)}));
  return zipStore(files);
}

/* ---- PDF writer (tanpa library) ---- */
function pdfNorm(s){return String(s==null?'':s).replace(/[\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\u2026/g,'..').replace(/[\r\n\t]+/g,' ').replace(/[^\x20-\x7e\xa0-\xff]/g,'?');}
const pdfEsc=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function cw(ch){if(ch>='0'&&ch<='9')return .556;if(ch===' ')return .278;if('.,:;\'|!ilj'.includes(ch))return .26;if('ft'.includes(ch))return .31;if('rI()-[]/'.includes(ch))return .34;if(ch==='m')return .83;if(ch==='w')return .72;if(ch==='M'||ch==='W')return .9;if(ch>='A'&&ch<='Z')return .69;return .54;}
function tw(s,size,bold){let w=0;for(const ch of pdfNorm(s))w+=cw(ch);return w*size*(bold?1.05:1);}
function trunc(s,maxW,size,bold){s=pdfNorm(s);if(tw(s,size,bold)<=maxW)return s;while(s.length>1&&tw(s+'..',size,bold)>maxW)s=s.slice(0,-1);return s+'..';}
class PDF{
  constructor(){this.W=595.28;this.H=841.89;this.M=40;this.pages=[];this.title='';this.footer='';this.addPage();}
  addPage(){this.cur=[];this.pages.push(this.cur);this.y=this.M;}
  pageHead(){if(this.pages.length>1){this.text(this.title,this.M,this.M+4,{size:8,color:'#62708a'});this.line(this.M,this.M+10,this.W-this.M,this.M+10,'#dde4ee',.6);this.y=this.M+24;}}
  ensure(h){if(this.y+h>this.H-this.M-12){this.addPage();this.pageHead();}}
  _c(hex){const n=parseInt(hex.replace('#',''),16);return [(n>>16)&255,(n>>8)&255,n&255].map(v=>(v/255).toFixed(3)).join(' ');}
  text(s,x,y,o={}){const size=o.size||9;s=pdfNorm(s);const w=tw(s,size,o.bold);let px=x;if(o.align==='right')px=x-w;else if(o.align==='center')px=x-w/2;
    this.cur.push(`BT /${o.bold?'F2':'F1'} ${size} Tf ${this._c(o.color||'#0f1d33')} rg ${px.toFixed(2)} ${(this.H-y).toFixed(2)} Td (${pdfEsc(s)}) Tj ET`);}
  rect(x,y,w,h,fill){this.cur.push(`${this._c(fill)} rg ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);}
  line(x1,y1,x2,y2,color,lw){this.cur.push(`${this._c(color||'#000000')} RG ${lw||.5} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`);}
  h2(t){this.ensure(40);this.y+=6;this.text(t,this.M,this.y+10,{size:11,bold:true,color:'#12305a'});this.y+=18;}
  table(cols,rows,o={}){
    const sz=o.size||8,rh=o.rh||15,M=this.M,totalW=cols.reduce((a,c)=>a+c.w,0);
    const head=()=>{this.rect(M,this.y,totalW,rh,'#0b1f3a');let x=M;cols.forEach(c=>{this.text(trunc(c.h,c.w-8,sz,true),c.a==='r'?x+c.w-4:x+4,this.y+rh-4.8,{size:sz,bold:true,color:'#ffffff',align:c.a==='r'?'right':'left'});x+=c.w;});this.y+=rh;};
    this.ensure(rh*3);head();
    if(!rows.length){this.text('Tidak ada data',M+4,this.y+rh-4.8,{size:sz,color:'#62708a'});this.y+=rh;}
    rows.forEach((r,i)=>{
      if(this.y+rh>this.H-this.M-12){this.addPage();this.pageHead();head();}
      if(i%2)this.rect(M,this.y,totalW,rh,'#f4f7fb');
      let x=M;cols.forEach(c=>{const v=String(c.f(r));const col=c.col?c.col(r):'#0f1d33';this.text(trunc(v,c.w-8,sz,false),c.a==='r'?x+c.w-4:x+4,this.y+rh-4.8,{size:sz,color:col,align:c.a==='r'?'right':'left'});x+=c.w;});
      this.y+=rh;});

  }
  bytes(){
    const n=this.pages.length;

  }
}

function barChart(id,labels,s1,s2,opt){

    const pl=50,pr=6,pt=10,pb=26,iw=w-pl-pr,ih=h-pt-pb,mx=niceMax(Math.max(0,...s1,...s2));

    c.font='11px system-ui,sans-serif';c.textBaseline='middle';

  if(splashDone&&!opt.still&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const t0=performance.now();const stp=n=>{const k=Math.min(1,(n-t0)/700);fn(-1,1-Math.pow(1-k,3));if(k<1&&cv.isConnected)requestAnimationFrame(stp);};requestAnimationFrame(stp);}else fn();
}

function compressImage(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};img.src=r.result;};r.readAsDataURL(file);});}
function bindEntry(type){

/* ---------- RIWAYAT ---------- */
function filterTx(f){
  const q=f.q.trim().toLowerCase();
  return db.transactions.filter(t=>{
    if(f.type!=='all'&&t.type!==f.type)return false;if(f.branch!=='all'&&t.branchId!==f.branch)return false;
    if(f.from&&t.date<f.from)return false;if(f.to&&t.date>f.to)return false;
    if(f.year&&t.date.slice(0,4)!==String(f.year))return false;if(f.month&&t.date.slice(5,7)!==f.month)return false;
    if(q){const hay=(bName(t.branchId)+' '+label(t)+' '+(t.desc||'')+' '+(t.ref||'')+' '+t.amount+' '+fmtDate(t.date)).toLowerCase();if(!hay.includes(q))return false;}
    return true;}).sort(byDateDesc);
}

/* ---------- LAPORAN ---------- */
function reportRange(r){
  if(r.period==='harian')return [r.date,r.date];
  if(r.period==='mingguan'){const d=parseISO(r.date),dow=(d.getDay()+6)%7,s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow),e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);return [isoOf(s),isoOf(e)];}
  if(r.period==='bulanan'){const y=+r.year,m=+r.month;return [y+'-'+pad(m)+'-01',y+'-'+pad(m)+'-'+pad(new Date(y,m,0).getDate())];}
  return [r.year+'-01-01',r.year+'-12-31'];
}
function computeReport(r){
  const [from,to]=reportRange(r),pool=db.transactions.filter(t=>r.branch==='all'||t.branchId===r.branch);
  const inR=pool.filter(t=>t.date>=from&&t.date<=to).sort(byDateAsc),before=pool.filter(t=>t.date<from);
  const sg=t=>t.type==='in'?t.amount:-t.amount,opening=before.reduce((a,t)=>a+sg(t),0),st=stats(inR);
  const map={},ens=id=>map[id]||(map[id]={id,name:bName(id),open:0,in:0,out:0});
  before.forEach(t=>{ens(t.branchId).open+=sg(t);});inR.forEach(t=>{ens(t.branchId)[t.type]+=t.amount;});
  const perBranch=Object.values(map).map(x=>({...x,net:x.in-x.out,close:x.open+x.in-x.out})).sort((a,b)=>a.name.localeCompare(b.name));
  const perCat=groupCats(inR);
  let labels=[],full=[],sin=[],sout=[],ctitle;
  if(r.period==='harian'){const top=perBranch.filter(x=>x.in||x.out).sort((a,b)=>(b.in+b.out)-(a.in+a.out)).slice(0,12);labels=top.map(x=>x.name.length>9?x.name.slice(0,8)+'…':x.name);full=top.map(x=>x.name);sin=top.map(x=>x.in);sout=top.map(x=>x.out);ctitle='Pemasukan vs Pengeluaran per Cabang';}
  else if(r.period==='tahunan'){for(let m=0;m<12;m++){const k=r.year+'-'+pad(m+1);labels.push(MON_S[m]);full.push(MONTHS[m]+' '+r.year);sin.push(inR.filter(t=>t.type==='in'&&t.date.slice(0,7)===k).reduce((a,t)=>a+t.amount,0));sout.push(inR.filter(t=>t.type==='out'&&t.date.slice(0,7)===k).reduce((a,t)=>a+t.amount,0));}ctitle='Pemasukan vs Pengeluaran per Bulan';}
  else{const days={};inR.forEach(t=>{(days[t.date]||(days[t.date]={in:0,out:0}))[t.type]+=t.amount;});
    for(let d=parseISO(from);isoOf(d)<=to;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){const k=isoOf(d),x=days[k]||{in:0,out:0};labels.push(r.period==='mingguan'?DAYS_S[d.getDay()]+' '+d.getDate():String(d.getDate()));full.push(DAYS[d.getDay()]+', '+fmtDate(k));sin.push(x.in);sout.push(x.out);}
    ctitle='Pemasukan vs Pengeluaran per Hari';}
  const pname={harian:'Harian',mingguan:'Mingguan',bulanan:'Bulanan',tahunan:'Tahunan'}[r.period];
  let lbl;if(r.period==='harian')lbl=DAYS[parseISO(r.date).getDay()]+', '+fmtDate(r.date);else if(r.period==='mingguan')lbl=fmtDate(from)+' s.d. '+fmtDate(to);else if(r.period==='bulanan')lbl=MONTHS[r.month-1]+' '+r.year;else lbl='Tahun '+r.year;
  return {from,to,txs:inR,opening,in:st.in,out:st.out,close:opening+st.in-st.out,n:st.n,perBranch,perCat,labels,full,sin,sout,ctitle,pname,label:lbl,branchLabel:r.branch==='all'?'Semua Cabang':bName(r.branch)};
}

  <div class="card"><h3>Backup Data (JSON)</h3><p class="sm mut" style="margin-top:0">Simpan seluruh data (cabang, transaksi, dan foto nota) ke satu file JSON. Lakukan backup secara berkala.</p><button class="btn" data-act="backup">${ic('download')}Download Backup</button></div>
  <div class="card"><h3>Restore Data</h3><p class="sm mut" style="margin-top:0">Pulihkan data dari file backup JSON. Data saat ini akan <b>diganti</b>.</p><input type="file" id="rFile" accept=".json,application/json" hidden><button class="btn navy" data-act="restore">${ic('upload')}Pilih File Backup</button></div>
  <div class="card" style="grid-column:1/-1;border:1px solid #f5c6c8"><h3 style="color:var(--red-d)">Zona Berbahaya</h3><p class="sm mut" style="margin-top:0">Menghapus seluruh cabang, transaksi, dan foto dari perangkat ini. Tindakan tidak dapat dibatalkan — lakukan backup lebih dulu.</p><button class="btn danger" data-act="reset">${ic('trash')}Hapus Semua Data</button></div></div>`;
}
function doBackup(){
  const payload={app:'monitoring-keuangan-maintenance',version:1,exportedAt:new Date().toISOString(),data:db};
  download('Backup_Keuangan_Maintenance_'+todayISO()+'.json',new Blob([JSON.stringify(payload)],{type:'application/json'}));
  commit(()=>{db.settings.lastBackup=Date.now();});toast('Backup berhasil dibuat','ok');if(currentView()==='pengaturan'||currentView()==='dashboard')render();
}
async function doRestore(file){
  let obj;try{obj=JSON.parse(await file.text());}catch(e){return toast('File bukan JSON yang valid','err');}
  const d=obj&&obj.data?obj.data:obj;
  if(!d||!Array.isArray(d.branches)||!Array.isArray(d.transactions))return toast('Format backup tidak dikenali','err');
  const branches=d.branches.filter(b=>b&&b.id&&b.name).map(b=>({id:String(b.id),name:String(b.name),address:String(b.address||''),pic:String(b.pic||''),createdAt:+b.createdAt||Date.now()}));
  const ids=new Set(branches.map(b=>b.id));let skipped=0;const txs=[];
  d.transactions.forEach(t=>{if(!t||(t.type!=='in'&&t.type!=='out')||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')||!(+t.amount>0)||!ids.has(String(t.branchId))){skipped++;return;}
    const o={id:String(t.id||uid()),type:t.type,date:t.date,branchId:String(t.branchId),desc:String(t.desc||''),amount:Math.round(+t.amount),createdAt:+t.createdAt||Date.now()};
    if(t.type==='in'){o.source=String(t.source||'Lainnya');o.ref=String(t.ref||'');}else{o.category=String(t.category||'Lainnya');if(typeof t.photo==='string'&&t.photo.startsWith('data:image/'))o.photo=t.photo;}txs.push(o);});
  const ok=await confirmBox({title:'Restore data?',msg:`Data saat ini akan diganti dengan backup berisi <b>${branches.length} cabang</b> dan <b>${txs.length} transaksi</b>${skipped?` (${skipped} baris tidak valid dilewati)`:''}.`,ok:'Ya, Restore',danger:true});
  if(!ok)return;
  if(commit(()=>{db=norm({branches,transactions:txs,settings:Object.assign({},d.settings||{})});})){toast('Data berhasil dipulihkan','ok');render();}
}

/* ---------- actions ---------- */
function startEdit(id){const t=db.transactions.find(x=>x.id===id);if(!t)return;editing={id,view:t.type==='in'?'masuk':'keluar'};entryPhoto=t.photo||null;closeModal();go(editing.view);window.scrollTo({top:0,behavior:'smooth'});}
async function delTx(id){
  const t=db.transactions.find(x=>x.id===id);if(!t)return;const ctx=openBranchHist;
  const ok=await confirmBox({title:'Hapus transaksi?',msg:`${esc(label(t))} · <b>${rp(t.amount)}</b><br>${esc(bName(t.branchId))} · ${fmtDate(t.date)}`,ok:'Hapus',danger:true});
  if(ok&&commit(()=>{db.transactions=db.transactions.filter(x=>x.id!==id);})){toast('Transaksi dihapus','ok');if(editing&&editing.id===id)editing=null;render();}
  if(ctx)showBranchHist(ctx);
}
async function delBranch(id){
  const b=bById(id);if(!b)return;const n=db.transactions.filter(t=>t.branchId===id).length;
  const ok=await confirmBox({title:'Hapus cabang?',msg:`Cabang <b>${esc(b.name)}</b> akan dihapus${n?` beserta <b>${n} transaksinya</b>`:''}. Tindakan ini tidak dapat dibatalkan.`,ok:'Hapus Cabang',danger:true});
  if(ok&&commit(()=>{db.branches=db.branches.filter(x=>x.id!==id);db.transactions=db.transactions.filter(t=>t.branchId!==id);})){toast('Cabang dihapus','ok');if(dash.branch===id)dash.branch='all';if(hf.branch===id)hf.branch='all';if(rpt.branch===id)rpt.branch='all';render();}
}
function showPhoto(src,title){openModal(`<div class="card-h"><h3>${esc(title||'Foto Nota')}</h3><button class="icon-btn" data-act="modalClose">${ic('x')}</button></div><img class="big" src="${src}" alt="Nota"><div class="mb"><a class="btn ghost" download="nota_${todayISO()}.jpg" href="${src}">${ic('download')}Simpan Foto</a></div>`,true);}

/* ---------- tema, hitung-naik, sparkline, splash ---------- */
let splashDone=false;
const greet=()=>{const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';};
function spark(v){
  if(v.length<2)return '';const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  const pts=v.map((y,i)=>(i*100/(v.length-1)).toFixed(1)+' '+(30-((y-mn)/r)*24).toFixed(1));
  const d='M'+pts.join(' L');
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L100 34 L0 34Z" fill="rgba(46,229,157,.2)"/><path d="${d}" fill="none" stroke="#2ee59d" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function countUp(){
  if(!splashDone||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  $$('[data-cu]').forEach(el=>{const to=+el.dataset.cu,f=el.dataset.f==='n'?fmtNum:rp,t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/900);el.textContent=f(to*(1-Math.pow(1-k,3)));if(k<1&&el.isConnected)requestAnimationFrame(step);else el.textContent=f(to);};
    requestAnimationFrame(step);});
}
function applyTheme(t){
  document.body.classList.toggle('dark',t==='dark');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0a1426':'#0b1f3a';
  const b=$('#themeBtn');if(b)b.innerHTML=ic(t==='dark'?'sun':'moon');
}
const getTheme=()=>{try{return localStorage.getItem('mkm_theme')||'light';}catch(e){return 'light';}};
window.addEventListener('beforeprint',()=>{document.body.dataset.wasDark=document.body.classList.contains('dark')?'1':'';document.body.classList.remove('dark');});
window.addEventListener('afterprint',()=>{if(document.body.dataset.wasDark==='1')document.body.classList.add('dark');});
function initSplash(){
  const sp=$('#splash');if(!sp){splashDone=true;return;}
  const TOTAL=10000,bar=$('#spBar'),pc=$('#spPct'),msg=$('#spMsg'),skip=$('#spSkip'),pr=$('#spParts');
  for(let i=0;i<22;i++){const d=document.createElement('i');d.className='pt';const s=3+Math.random()*6;d.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;animation-duration:${(7+Math.random()*9).toFixed(1)}s;animation-delay:${(-Math.random()*12).toFixed(1)}s;opacity:${(.15+Math.random()*.4).toFixed(2)}`;pr.appendChild(d);}
  const M=[[0,'Menyiapkan aplikasi…'],[14,'Membuka penyimpanan data…'],[34,'Memuat data cabang…'],[54,'Menghitung saldo & transaksi…'],[74,'Menyiapkan dashboard…'],[92,'Hampir selesai…']];
  const t0=performance.now();let shown=-1,ended=false,cut=false;
  skip.onclick=()=>{cut=true;};
  setTimeout(()=>skip.classList.add('show'),4000);
  const end=()=>{ended=true;bar.style.width='100%';pc.textContent='100%';msg.textContent='Siap digunakan!';
    setTimeout(()=>{splashDone=true;document.body.classList.remove('noscroll');render();sp.classList.add('out');setTimeout(()=>sp.remove(),900);},cut?120:450);};
  const tick=now=>{if(ended)return;const k=cut?1:Math.min(1,(now-t0)/TOTAL),p=Math.floor(k*100);
    bar.style.width=(k*100).toFixed(1)+'%';
    if(p!==shown){shown=p;pc.textContent=p+'%';let t=M[0][1];M.forEach(x=>{if(p>=x[0])t=x[1];});if(k<1&&msg.textContent!==t)msg.textContent=t;}
    if(k>=1)end();else requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

const A={
  theme:()=>{const t=document.body.classList.contains('dark')?'light':'dark';try{localStorage.setItem('mkm_theme',t);}catch(e){}applyTheme(t);render();},
  nav:(id,el)=>{editing=null;document.body.classList.remove('menu-open');go(el.dataset.v);},
  menu:()=>document.body.classList.toggle('menu-open'),
  closeMenu:()=>document.body.classList.remove('menu-open'),
  edit:id=>startEdit(id),del:id=>delTx(id),
  photo:id=>{const t=db.transactions.find(x=>x.id===id);if(t&&t.photo)showPhoto(t.photo,'Nota · '+bName(t.branchId)+' · '+fmtDate(t.date));},
  photoCur:()=>{if(entryPhoto)showPhoto(entryPhoto);},
  pickPhoto:()=>$('#fFile').click(),
  rmPhoto:()=>{entryPhoto=null;$('#photoBox').innerHTML=photoBoxHTML();},
  cancelEdit:()=>{editing=null;entryPhoto=null;render();},
  quickBranch:()=>branchModal(null,nid=>{lastBranch=nid;render();}),
  branchAdd:()=>branchModal(null),
  branchEdit:id=>branchModal(id),
  branchDel:id=>delBranch(id),
  branchHist:id=>showBranchHist(id),
  modalClose:()=>closeModal(),
  histType:(id)=>{hf.type=id;hf.limit=30;go('riwayat');},
  more:()=>{hf.limit+=50;drawHistory();},
  hReset:()=>{hf={q:'',type:'all',branch:'all',from:'',to:'',month:'',year:'',limit:30};render();},
  hExport:()=>exportHistoryXlsx(),
  rXlsx:()=>exportReportXlsx(),rPdf:()=>exportReportPdf(),
  rPrint:()=>{window.print();},
  backup:()=>doBackup(),
  restore:()=>$('#rFile').click(),
  saveOrg:()=>{const v=$('#sOrg').value.trim();if(commit(()=>{db.settings.org=v;}))toast('Disimpan','ok');},
  reset:async()=>{
    const ok=await confirmBox({title:'Hapus semua data?',msg:'Seluruh cabang, transaksi, dan foto nota akan dihapus permanen dari perangkat ini.',ok:'Lanjutkan',danger:true});if(!ok)return;
    openModal(`<h3>Konfirmasi akhir</h3><p style="margin-top:0" class="mut">Ketik <b>HAPUS</b> untuk menghapus semua data.</p><div class="field"><input id="rsT" placeholder="HAPUS" autocomplete="off"></div><div class="mb"><button class="btn ghost" id="rsN">Batal</button><button class="btn danger" id="rsY">Hapus Semua</button></div>`);
    $('#rsN').onclick=()=>closeModal();$('#rsY').onclick=()=>{if($('#rsT').value.trim().toUpperCase()!=='HAPUS')return toast('Ketik HAPUS untuk melanjutkan','err');const org=db.settings.org;if(commit(()=>{db=blank();db.settings.org=org;})){closeModal();toast('Semua data dihapus');render();}};
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset.id,el,e);}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dBranch'){dash.branch=t.value;render();}
  else if(t.id==='dYear'){dash.year=+t.value;render();}
  else if(t.id==='rFile'&&t.files[0]){doRestore(t.files[0]);t.value='';}
});
document.addEventListener('input',e=>{if(e.target.id==='bSearch'){cq=e.target.value;drawBranchGrid();}});

/* bind per tampilan (dipanggil setelah render) */
const _render=render;
render=function(){_render();const v=currentView();if(v==='masuk')bindEntry('in');else if(v==='keluar')bindEntry('out');else if(v==='laporan')bindReport();countUp();};
var render;
window.addEventListener('hashchange',()=>render());
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{$$('canvas').forEach(c=>c._fn&&c._fn());},150);});
document.body.classList.toggle('dark',getTheme()==='dark');
applyTheme(getTheme());
initChrome();
if(!location.hash)history.replaceState(null,'','#dashboard');
render();
initSplash();
})();
</script>
</body>
</html>
